    <path d="M268 277h28"/>
  </g>

  <g>
    <text x="304" y="228" font-size="14" font-weight="600" fill="#1C1C1E">dsh-avatar-balance</text>
    <text x="304" y="247" font-size="12" fill="#6B6B70">sidebar.footer.action, full width</text>
    <text x="304" y="265" font-size="12" fill="#B8711F">amber ⚠ below the threshold</text>
    <text x="304" y="283" font-size="12" fill="#3A8F4E">green ✓ above it</text>
  </g>
  <g>
    <text x="304" y="305" font-size="12" fill="#8E8E93">the shipped account row stays below it</text>
  </g>
