<svg xmlns="http://www.w3.org/2000/svg" width="704" height="336" viewBox="0 0 704 336" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="704" height="336" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="703" height="335" rx="17.5" fill="none" stroke="#E6E6EB"/>

  <!-- sidebar -->
  <rect x="24" y="24" width="256" height="288" rx="14" fill="#F6F6F8" stroke="#E6E6EB"/>

  <!-- faded session rows for context -->
  <g fill="#DCDCE1">
    <rect x="40" y="46" width="150" height="9" rx="4.5"/>
    <rect x="40" y="66" width="112" height="9" rx="4.5"/>
    <rect x="40" y="86" width="132" height="9" rx="4.5"/>
    <rect x="40" y="112" width="88" height="9" rx="4.5"/>
  </g>
  <g fill="#E4E4E9">
    <rect x="40" y="132" width="126" height="9" rx="4.5"/>
    <rect x="40" y="152" width="100" height="9" rx="4.5"/>
  </g>

  <!-- balance row (highlighted) -->
  <rect x="36" y="218" width="232" height="38" rx="10" fill="#FFFFFF" stroke="#F0A32B" stroke-width="1.5"/>
  <g stroke="#8E8E93" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M48.5 232.5h11.5v8.6a1.1 1.1 0 0 1-1.1 1.1h-9.3a1.1 1.1 0 0 1-1.1-1.1Z"/>
    <path d="M48.5 232.5v-1.5a1.4 1.4 0 0 1 1.4-1.4h7.3"/>
  </g>
  <text x="67" y="242" font-size="12.5" fill="#6B6B70">余额</text>
  <text x="96" y="242" font-size="13" font-weight="600" fill="#1C1C1E">¥12.34</text>
  <text x="146" y="242" font-size="12" fill="#8E8E93">+¥0.50</text>
  <!-- amber warning mark -->
  <g transform="translate(199,227)" fill="none" stroke="#F0A32B" stroke-width="1.4" stroke-linejoin="round">
    <path d="M7.5 1.6 14 13H1Z"/>
    <path d="M7.5 5.6v3.2" stroke-linecap="round"/>
    <circle cx="7.5" cy="11" r="0.8" fill="#F0A32B" stroke="none"/>
  </g>
  <!-- refresh glyph -->
  <g transform="translate(222,229)" fill="none" stroke="#8E8E93" stroke-width="1.4" stroke-linecap="round">
    <path d="M11 6a5 5 0 1 1-1.6-3.7"/>
    <path d="M11.2 1v3.2H8"/>
  </g>

  <!-- account row (shipped) -->
  <circle cx="53" cy="277" r="12" fill="#E4E4E9"/>
  <circle cx="53" cy="273" r="4" fill="#B9B9C0"/>
  <path d="M45.5 284c1.4-3 4.2-4.6 7.5-4.6s6.1 1.6 7.5 4.6" fill="#B9B9C0"/>
  <text x="72" y="282" font-size="13" fill="#1C1C1E">Lawrence</text>
  <circle cx="236" cy="277" r="3" fill="#34C759"/>
  <path d="M246 272l4 5-4 5" fill="none" stroke="#B9B9C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- callouts -->
  <g stroke="#C9C9CF" stroke-width="1" stroke-dasharray="3 3" fill="none">
